<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>TouchChat WordPower 60 Basic - Modified Communication Board</title>
<style>
  :root{
    --c1:#FCEBA3; /* yellow  - feelings & social */
    --c2:#B9DCF4; /* blue    - questions & pronouns */
    --c3:#BEE8BE; /* green   - verbs */
    --c4:#DBCBF0; /* purple  - verbs */
    --c5:#BEE8BE; /* green   - more verbs */
    --c6:#F8C8C0; /* red     - core words */
    --ink:#1a1a1a;
    --bar:#2b5c8f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{height:100%;overflow:hidden;background:#e8e4dc;font-family:Arial,Helvetica,sans-serif;}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}

  /* ===== Header ===== */
  header{
    background:var(--bar);color:#fff;
    padding:8px 12px;
    display:flex;align-items:center;gap:10px;
    flex-wrap:wrap;
  }
  header h1{font-size:clamp(14px,2.4vmin,20px);font-weight:bold;letter-spacing:.3px;flex:1;min-width:200px;}
  .hbtn{
    background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:8px;padding:6px 12px;font-size:clamp(12px,1.8vmin,15px);font-weight:bold;cursor:pointer;
  }
  .hbtn:active{background:rgba(255,255,255,.4);}
  select.hbtn{color:#fff;background:rgba(255,255,255,.22);}
  select.hbtn option{color:#111;}

  /* ===== Message window ===== */
  #msgbar{
    background:#fff;border-bottom:3px solid #c9c2b4;
    padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:56px;
  }
  #msg{
    flex:1;font-size:clamp(18px,3.6vmin,30px);font-weight:bold;color:var(--ink);
    min-height:38px;display:flex;align-items:center;overflow-x:auto;white-space:nowrap;
  }
  #msg .word{background:#eef3f8;border:1px solid #c3d2e0;border-radius:6px;padding:2px 8px;margin-right:6px;flex-shrink:0;}
  #msg:empty::before{content:"Tap words to build a message…";color:#b9b2a4;font-weight:normal;}
  .mbtn{
    background:var(--bar);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:clamp(14px,2.4vmin,18px);font-weight:bold;cursor:pointer;flex-shrink:0;
  }
  .mbtn.alt{background:#8a8378;}
  .mbtn:active{transform:scale(.96);}

  /* ===== Board ===== */
  #board{
    flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));
    gap:6px;padding:10px;min-height:0;
  }
  .cell{
    background:#fff;border-radius:8px;border:1px solid #d8d2c4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;cursor:pointer;position:relative;overflow:hidden;min-height:0;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .cell:active{transform:scale(.96);}
  .cell,.mbtn,.hbtn{touch-action:manipulation;}
  .cell svg{width:min(52%,64px);height:auto;flex-shrink:0;max-height:70%;}
  .cell .label{
    font-size:clamp(11px,2.1vmin,17px);font-weight:bold;color:var(--ink);
    line-height:1.1;text-align:center;padding:0 2px;overflow-wrap:anywhere;
  }
  .cell.lblonly svg{display:none;}
  .cell.lblonly .label{font-size:clamp(15px,3vmin,24px);}
  .cell .iconwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%;}
  .cell .labelwrap{display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;min-height:0;width:100%;flex:0 0 auto;}
  .r1{background:var(--c1);} .r2{background:var(--c2);} .r3{background:var(--c3);}
  .r4{background:var(--c4);} .r5{background:var(--c5);} .r6{background:var(--c6);}

  /* press flash */
  .cell.flash{animation:flash .5s ease;}
  @keyframes flash{0%{filter:brightness(1.35);}100%{filter:brightness(1);}}

  /* ===== Toast for voice fallback ===== */
  #toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:#333;color:#fff;padding:10px 18px;border-radius:10px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;}

  @media (max-width:700px){
    #board{gap:4px;padding:6px;}
    header{padding:6px 8px;gap:6px;}
    .mbtn{padding:8px 12px;font-size:13px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗣️ TouchChat WordPower 60 Basic <span style="font-weight:normal;opacity:.85">— Modified Communication Board</span></h1>
    <select id="voiceSel" class="hbtn" title="Voice"></select>
    <button class="hbtn" id="btnFull" title="Fullscreen">⛶</button>
  </header>

  <div id="msgbar">
    <div id="msg"></div>
    <button class="mbtn" id="btnSpeak">🔊 Speak</button>
    <button class="mbtn alt" id="btnClear">🗑 Clear</button>
  </div>

  <div id="board"></div>
</div>
<div id="toast"></div>

    {t:'your',  icon:'personPointR'},
    {t:'no',    icon:'x'},
    {t:'want',  icon:'handUp'},
    {t:'take',  icon:'take'},
    {t:'tell',  icon:'tell'},
    {t:'turn',  icon:'turn'},
    {t:'watch', icon:'watch'},
    {t:'down',  icon:'arrowDown'},
    {t:'again', icon:'again'},
  ]},
];

/* ---------- Render board ---------- */
const board = document.getElementById('board');
ROWS.forEach(row=>{
  row.cells.forEach(cell=>{
    const b = document.createElement('button');
    b.className = 'cell ' + row.cls + (cell.icon ? '' : ' lblonly');
    b.setAttribute('aria-label', cell.t);
    b.innerHTML = cell.icon
      ? '<span class="iconwrap">'+icon(cell.icon)+'</span><span class="labelwrap"><span class="label">'+cell.t+'</span></span>'
      : '<span class="labelwrap"><span class="label">'+cell.t+'</span></span>';
    b.addEventListener('click', ()=>pressCell(b, cell));
    board.appendChild(b);
  });
});

/* ---------- Speech ---------- */
const msg = document.getElementById('msg');
let sentence = [];          // array of words in the message window
let voice = null;
const synth = window.speechSynthesis;
let speakTimer = null;      // iOS: cancel->speak race needs a delay
let lastTapAt = 0;          // double-tap guard for accidental second taps
let lastTapBtn = null;      // ...only on the SAME button

function savePref(k, v){
  try{ localStorage.setItem(k, v); }catch(e){ /* private mode / restricted webview — ignore */ }
}
function loadPref(k){
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}

function loadVoices(){
  const sel = document.getElementById('voiceSel');
  const voices = synth.getVoices();
  if(!voices.length) return;
  const prev = sel.value;
  sel.innerHTML = '';
  const preferred = [];
  const rest = [];
  voices.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + ' (' + v.lang + ')';
    if(/en[-_]US/i.test(v.lang) && /female|zira|aria|jenny|samantha|michelle/i.test(v.name)) preferred.push(o);
    else rest.push(o);
  });
  preferred.concat(rest).forEach(o=>sel.appendChild(o));
  sel.value = (prev && [...sel.options].some(o=>o.value===prev)) ? prev
    : (preferred[0] ? preferred[0].value : (voices[0].name));
  voice = synth.getVoices().find(v=>v.name===sel.value) || null;
  savePref('wp60-voice', sel.value);
}
if(synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
if(synth) loadVoices();
document.getElementById('voiceSel').addEventListener('change', e=>{
  voice = synth.getVoices().find(v=>v.name===e.target.value) || null;
  savePref('wp60-voice', e.target.value);
  speak('OK');
});

function speak(text){
  if(!synth || !text) return;
  // iOS Safari: cancel() followed by speak() in the same task drops audio.
  // Delay the new utterance so rapid taps always produce sound.
  clearTimeout(speakTimer);
  speakTimer = setTimeout(()=>{
    try{ synth.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.lang = (voice && voice.lang) || 'en-US';
    u.rate = 0.9; u.pitch = 1.0; u.volume = 1.0;   // slightly slower = clearer for a 4yo
    u.onerror = e=>{
      if(e.error !== 'not-allowed' && e.error !== 'interrupted' && e.error !== 'canceled'){
        toast('Voice error: ' + e.error);
      }
    };
    synth.speak(u);
  }, 80);
}

function toast(t){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ---------- Interactions ---------- */
function pressCell(btn, cell){
  // double-tap guard: ignore a second tap on the SAME button within 350ms
  // (accidental double-taps), but allow fast taps across different buttons
  // so sentence building ("I want more") is never blocked.
  const now = Date.now();
  if(btn === lastTapBtn && now - lastTapAt < 350) return;
  lastTapBtn = btn;
  lastTapAt = now;
  btn.classList.remove('flash');
  void btn.offsetWidth;          // restart animation
  btn.classList.add('flash');
  speak(cell.s || cell.t);       // 1) speak the word immediately (spoken form overrides label)
  sentence.push(cell.t);         // 2) add to message window
  renderMsg();
}

function renderMsg(){
  msg.innerHTML = sentence.map((w,i)=>
    '<span class="word" data-i="'+i+'">'+w+'</span>'
  ).join('');
  msg.scrollLeft = msg.scrollWidth;
}

// tap a word chip in the message bar to remove just that word (undo a mis-tap)
msg.addEventListener('click', e=>{
  const chip = e.target.closest('.word');
  if(!chip) return;
  const i = parseInt(chip.dataset.i, 10);
  if(isNaN(i)) return;
  sentence.splice(i, 1);
  renderMsg();
});

document.getElementById('btnSpeak').addEventListener('click', ()=>{
  if(sentence.length){
    speak(sentence.join(' '));
  } else {
    toast('Build a message first — tap some words!');
  }
});
document.getElementById('btnClear').addEventListener('click', ()=>{
  synth.cancel();
  sentence = [];
  renderMsg();
});
document.getElementById('btnFull').addEventListener('click', ()=>{
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  // iOS Safari: Fullscreen API is not available for arbitrary elements
  if(document.documentElement.requestFullscreen){
    try{
      document.documentElement.requestFullscreen()
        .catch(()=>toast('Fullscreen blocked by browser'));
    }catch(e){ toast('Fullscreen not supported here'); }
  } else {
    toast('Fullscreen not supported on this device');
  }
});

/* restore saved voice on load */
(function(){
  const saved = loadPref('wp60-voice');
  if(saved){ const sel=document.getElementById('voiceSel'); sel.value=saved; voice=synth.getVoices().find(v=>v.name===saved)||null; }
})();
</script>
</body>
</html>
